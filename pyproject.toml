[project]
name = "podcast-search"
version = "0.1.0"
description = "Search podcast back catalogues with Claude-written questions judged by TypeSafe Jev; save picks to Spotify"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
podcast-search = "podcast_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_search"]
